<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Курсы валют — Калининград</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#14181f;--mut:#6b7280;--ac:#1d4ed8;--ok:#0a8a4a;--bd:#e3e6eb;--hl:#e8f7ee}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#1a1f29;--tx:#eef1f6;--mut:#98a2b3;--ac:#6ea0ff;--ok:#43d08a;--bd:#2a3140;--hl:#12301f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}h1{font-size:20px;margin:4px 0 
12px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;color:var(--mut);margin:0 0 6px}.big{font-size:28px;font-weight:700}.sub,.note{font-size:13px;color:var(--mut)}
.best{color:var(--ok);font-weight:700}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--bd)}.row:first-child{border-top:0}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-size:12px}td.b{background:var(--hl);color:var(--ok);font-weight:700}.hidden{display:none}.stale{opacity:.6}
</style></head><body><main>
<h1>Курсы USD и EUR — Калининград</h1>
<div class="tabs"><button id="t1" class="on">Главная</button><button id="t2">Банки и 
обменники</button></div>
<section id="p1"><div class="grid" id="cbr"></div><div class="card"><h2>Лучший курс в городе</h2><div id="best"></div></div>
<div class="note">Купить — где продают дешевле всего. Продать — где покупают дороже всего.</div></section>
<section id="p2" class="hidden"><div class="card scroll"><table id="tb"></table></div></section>
<p class="note" id="st"></p></main>
<script>
const $=i=>document.getElementById(i),f=x=>x.toFixed(2).replace('.',','),esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
function 
tab(n){$('p1').className=n==1?'':'hidden';$('p2').className=n==2?'':'hidden';$('t1').className=n==1?'on':'';$('t2').className=n==2?'on':''}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);
function render(d){
  const B=d.banks.filter(b=>b.u[0]>0&&b.e[0]>0);
  $('cbr').innerHTML=[['Доллар США',d.cbr.usd],['Евро',d.cbr.eur]].map(c=>`<div class="card"><h2>ЦБ РФ · ${c[0]}</h2><div class="big">${f(c[1])} ₽</div><div class="sub">на ${d.cbr.date}</div></div>`).join('');
  let h='';
  [['Доллар','u'],['Евро','e']].forEach(([nm,k])=>{
    if(!B.length)return;
    const 
buy=B.reduce((a,b)=>b[k][1]<a[k][1]?b:a),sell=B.reduce((a,b)=>b[k][0]>a[k][0]?b:a);
    h+=`<div class="row"><div><b>${nm}</b><div class="sub">Купить: ${esc(buy.n)}</div></div><div class="best">${f(buy[k][1])} ₽</div></div>`;
    h+=`<div class="row"><div class="sub">Продать: ${esc(sell.n)}</div><div class="best">${f(sell[k][0])} ₽</div></div>`;});
  $('best').innerHTML=h||'Нет данных';
  const mx={u0:0,e0:0,u1:1e9,e1:1e9};
  B.forEach(b=>['u','e'].forEach(k=>{mx[k+0]=Math.max(mx[k+0],b[k][0]);mx[k+1]=Math.min(mx[k+1],b[k][1])}));
  let t='<tr><th>Банк / обменник</th><th>USD покупка</th><th>USD продажа</th><th>EUR покупка</th><th>EUR 
продажа</th></tr>';
  B.forEach(b=>{t+=`<tr class="${b.stale?'stale':''}"><td>${esc(b.n)} <span class="sub">${b.t}${b.stale?' · устарело':''}</span></td>`+
    [['u',0],['u',1],['e',0],['e',1]].map(([k,i])=>`<td class="${b[k][i]===mx[k+i]?'b':''}">${f(b[k][i])}</td>`).join('')+'</tr>'});
  $('tb').innerHTML=t;
  $('st').textContent=(d.updated?'Обновлено: '+new Date(d.updated).toLocaleString('ru-RU'):'Загрузка…')+(d.errors.length?' · Проблемы: '+d.errors.join('; '):'');
}
async function load(){try{const d=await (await fetch('/api/rates')).json();if(d.cbr)render(d);else $('st').textContent='Данные загружаются, обновите через минуту…'}catch(e){$('st').textContent='Нет связи с сервером'}}
load();setInterval(load,5*60e3);
</script></body></html>
