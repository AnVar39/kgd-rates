<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Курсы валют · Калининград</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#1a6ef0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Курсы КГД">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#66707f;--ac:#1a6ef0;--ok:#0a8a4a;--okbg:#e3f6ec;--bd:#e2e5ea}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--card:#1a1f29;--tx:#eef1f5;--mu:#8e98a8;--ac:#5b9bff;--ok:#3ddc84;--okbg:#14301f;--bd:#2a3140}}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;max-width:720px;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}header img{height:56px;flex:none}h1{font-size:19px;margin:0;flex:1}
.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:26px;font-weight:700}.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok);font-weight:600}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th:first-child,td:first-child{text-align:left;white-space:normal}
th{cursor:pointer;user-select:none}th.on{color:var(--ac)}
tr.best{background:var(--okbg)}td.g{color:var(--ok);font-weight:700}
.lk{color:var(--ac);text-decoration:underline;cursor:pointer}#md{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:9}#md[hidden]{display:none}.mb{background:var(--card);width:100%;max-width:720px;max-height:82vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}.mb h2{margin:0 0 4px;font-size:18px}.br{padding:10px 0;border-bottom:1px solid var(--bd)}.br a{font-size:13px}#mc{float:right;border:0;background:none;color:var(--tx);font-size:22px}.chips{display:flex;gap:6px;margin:4px 0 10px}.chips button{flex:1;padding:8px 2px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-size:13px}.chips button.on{background:var(--ac);color:#fff;border-color:var(--ac)}.ch svg{width:100%;height:auto;display:block;touch-action:pan-y}.ch .hd{display:flex;justify-content:space-between;align-items:baseline}.pos{color:var(--ok)}.neg{color:#d64545}.dl{font-size:15px;font-weight:600;margin-left:4px}.err{color:#c0392b;font-size:13px}#inst{display:none;margin-top:8px;padding:8px 12px;border-radius:10px;border:0;background:var(--ac);color:#fff;font:inherit}
</style></head><body>
<header><h1>Курсы валют · Калининград</h1><img src="coat.png" alt="Герб Калининграда"></header>
<div class="mu" id="upd">Загрузка…</div><button id="inst">Установить приложение</button>
<div class="tabs"><button id="t1" class="on">Главная</button><button id="t2">Все банки</button></div>
<div id="v1"></div><div id="v2" hidden></div><div class="err" id="err"></div>
<div id="md" hidden><div class="mb"><button id="mc">✕</button><div id="mh"></div></div></div>
<script>
const $=id=>document.getElementById(id);
const f=x=>x==null?"—":x.toFixed(2);
const names={USD:"Доллар США",EUR:"Евро"};
const COLS=[["USD","buy","$ покупка"],["USD","sell","$ продажа"],["EUR","buy","€ покупка"],["EUR","sell","€ продажа"]];
let D=null,key="name",dir=1;
const val=(b,c,t)=>b[c]?b[c][t]:null;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const lk=b=>b?`<a class="lk" data-i="${D.banks.indexOf(b)}">${esc(b.name)}</a>`:"—";
function best(banks,c){
  const a=banks.filter(b=>b[c]);if(!a.length)return {};
  return {sell:a.reduce((m,b)=>b[c].buy>m[c].buy?b:m),buy:a.reduce((m,b)=>b[c].sell<m[c].sell?b:m)};
}
function winner(banks){
  const sc=new Map(banks.map(b=>[b.name,0]));
  COLS.forEach(([c,t])=>{
    const v=banks.map(b=>val(b,c,t)).filter(x=>x!=null);if(!v.length)return;
    const m=t==="buy"?Math.max(...v):Math.min(...v);
    banks.forEach(b=>{if(val(b,c,t)===m)sc.set(b.name,sc.get(b.name)+1)});
  });
  return banks.slice().sort((a,b)=>sc.get(b.name)-sc.get(a.name)||(val(a,"USD","sell")||999)-(val(b,"USD","sell")||999))[0];
}
function render2(){
  const banks=D.banks.slice();if(!banks.length){$("v2").innerHTML='<div class="card mu">Нет данных</div>';return}
  const w=winner(banks);
  const ext={};COLS.forEach(([c,t])=>{const v=banks.map(b=>val(b,c,t)).filter(x=>x!=null);ext[c+t]=v.length?(t==="buy"?Math.max(...v):Math.min(...v)):null});
  banks.sort((a,b)=>{
    if(key==="name")return dir*a.name.localeCompare(b.name,"ru");
    const [c,t]=key.split(".");const x=val(a,c,t),y=val(b,c,t);
    if(x==null)return 1;if(y==null)return -1;return dir*(x-y);
  });
  const arrow=k=>key===k?(dir>0?" ▲":" ▼"):"";
  let h='<div class="card wrap"><table><tr><th data-k="name" class="'+(key==="name"?"on":"")+'">Банк'+arrow("name")+'</th>'+
   COLS.map(([c,t,l])=>{const k=c+"."+t;return `<th data-k="${k}" class="${key===k?"on":""}">${l}${arrow(k)}</th>`}).join("")+"</tr>";
  banks.forEach(b=>{
    h+=`<tr class="${b===w?"best":""}"><td>${b===w?"★ ":""}${lk(b)}</td>`+COLS.map(([c,t])=>{const v=val(b,c,t);return `<td class="${v!=null&&v===ext[c+t]?"g":""}">${f(v)}</td>`}).join("")+"</tr>";
  });
  $("v2").innerHTML=h+`</table><div class="mu">Нажмите на заголовок столбца — сортировка по возрастанию/убыванию. Зелёная строка (★) — банк с лучшими курсами сразу в нескольких столбцах; зелёные цифры — лучшее значение в столбце. Покупка — банк покупает у вас, продажа — банк продаёт вам.</div></div>`;
  $("v2").querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(key===k)dir=-dir;else{key=k;dir=1}render2()});
}
function cbrDelta(c){
  if(!H||!D||!D.cbr[c]||!D.cbr.date)return"";
  const t=D.cbr.date.split(".").reverse().join("-");
  const prev=[...(H[c]||[])].reverse().find(p=>p[0]<t);
  if(!prev)return"";
  const r=Math.round((D.cbr[c]-prev[1])*100)/100;
  return ` <span class="dl ${r>0?"pos":r<0?"neg":""}">(${r>0?"+":r<0?"−":""}${Math.abs(r).toFixed(2)})</span>`;
}
function render1(){
  let h="";
  for(const c of["USD","EUR"]){
    const b=best(D.banks,c),cb=D.cbr[c];
    h+=`<div class="card"><b>${names[c]}</b>
    <div class="row"><span>Курс ЦБ${D.cbr.date?" ("+D.cbr.date+")":""}</span><span><span class="big">${f(cb)} ₽</span>${cbrDelta(c)}</span></div>
    <div class="row"><span>Продать выгоднее: <span class="mu">${lk(b.sell)}</span></span><span class="ok">${f(b.sell&&b.sell[c].buy)} ₽</span></div>
    <div class="row"><span>Купить выгоднее: <span class="mu">${lk(b.buy)}</span></span><span class="ok">${f(b.buy&&b.buy[c].sell)} ₽</span></div></div>`;
  }
  $("v1").innerHTML=h+`<div class="mu">«Продать» — банк покупает у вас валюту (макс. курс). «Купить» — банк продаёт вам (мин. курс).</div><h2 style="font-size:17px;margin:18px 0 8px">Динамика курса ЦБ</h2><div id="charts"></div>`;
  renderCharts();
}
fetch("data/rates.json?"+Date.now()).then(r=>r.json()).then(d=>{
  D=d;$("upd").textContent="Обновлено: "+(d.updated?new Date(d.updated).toLocaleString("ru-RU"):"нет данных");
  $("err").textContent=(d.errors||[]).join("; ");render1();render2();
}).catch(e=>$("err").textContent="Ошибка загрузки: "+e);
$("t1").onclick=()=>{$("v1").hidden=false;$("v2").hidden=true;$("t1").className="on";$("t2").className=""};
$("t2").onclick=()=>{$("v1").hidden=true;$("v2").hidden=false;$("t2").className="on";$("t1").className=""};

let H=null,P=30,CH={};
const PER=[[7,"7 дн."],[30,"1 мес."],[90,"3 мес."],[180,"6 мес."],[365,"1 год"]];
const dfmt=s=>s.split("-").reverse().join(".");
function renderCharts(){
  const el=$("charts");if(!el)return;
  if(!H){el.innerHTML='<div class="card mu">Графики появятся после ближайшего обновления данных.</div>';return}
  let h='<div class="chips">'+PER.map(([d,l])=>`<button data-p="${d}" class="${d===P?"on":""}">${l}</button>`).join("")+"</div>";
  const W=320,Ht=150,L=6,R=6,T=10,B=22,col={USD:"#1a6ef0",EUR:"#e8a317"};
  for(const c of["USD","EUR"]){
    const a=H[c]||[];if(!a.length)continue;
    const cut=new Date(a[a.length-1][0]);cut.setDate(cut.getDate()-P);
    const s=a.filter(p=>new Date(p[0])>=cut);CH[c]=s;const n=s.length;
    const vs=s.map(p=>p[1]);let mn=Math.min(...vs),mx=Math.max(...vs);if(mx-mn<0.01){mn-=0.5;mx+=0.5}
    const pad=(mx-mn)*0.08;mn-=pad;mx+=pad;
    const X=i=>L+(W-L-R)*(n>1?i/(n-1):0.5),Y=v=>T+(Ht-T-B)*(1-(v-mn)/(mx-mn));
    const d=s.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("");
    const ch=vs[n-1]-vs[0],pc=ch/vs[0]*100;
    h+=`<div class="card ch"><div class="hd"><b>${names[c]}</b><span><b>${f(vs[n-1])} ₽</b> <span class="${ch>0?"pos":ch<0?"neg":""}">${ch>=0?"+":""}${ch.toFixed(2)} (${pc.toFixed(1)}%)</span></span></div>
    <div class="mu" id="i_${c}">${dfmt(s[0][0])} — ${dfmt(s[n-1][0])} · мин ${f(Math.min(...vs))} · макс ${f(Math.max(...vs))}</div>
    <svg viewBox="0 0 ${W} ${Ht}" data-c="${c}"><path d="${d}L${X(n-1).toFixed(1)} ${Ht-B}L${X(0).toFixed(1)} ${Ht-B}Z" fill="${col[c]}" opacity=".12"/>
    <path d="${d}" fill="none" stroke="${col[c]}" stroke-width="2" stroke-linejoin="round"/>
    <line id="l_${c}" y1="${T}" y2="${Ht-B}" stroke="var(--mu)" stroke-dasharray="3" visibility="hidden"/><circle id="o_${c}" r="4" fill="${col[c]}" visibility="hidden"/>
    <text x="${L}" y="${Ht-6}" font-size="10" fill="var(--mu)">${dfmt(s[0][0]).slice(0,5)}</text><text x="${W-R}" y="${Ht-6}" font-size="10" text-anchor="end" fill="var(--mu)">${dfmt(s[n-1][0]).slice(0,5)}</text></svg></div>`;
  }
  el.innerHTML=h+'<div class="mu">Проведите пальцем по графику, чтобы увидеть курс на дату.</div>';
  el.querySelectorAll("svg").forEach(sv=>{
    const c=sv.dataset.c,s=CH[c],n=s.length;
    const mv=e=>{const r=sv.getBoundingClientRect();const px=(e.clientX-r.left)/r.width*W;
      const i=Math.max(0,Math.min(n-1,Math.round((px-L)/(W-L-R)*(n-1))));
      const vs=s.map(p=>p[1]);let mn=Math.min(...vs),mx=Math.max(...vs);if(mx-mn<0.01){mn-=0.5;mx+=0.5}const pad=(mx-mn)*0.08;mn-=pad;mx+=pad;
      const x=L+(W-L-R)*(n>1?i/(n-1):0.5),y=T+(Ht-T-B)*(1-(s[i][1]-mn)/(mx-mn));
      const ln=$("l_"+c),o=$("o_"+c);ln.setAttribute("x1",x);ln.setAttribute("x2",x);ln.setAttribute("visibility","visible");
      o.setAttribute("cx",x);o.setAttribute("cy",y);o.setAttribute("visibility","visible");
      $("i_"+c).textContent=dfmt(s[i][0])+" · "+f(s[i][1])+" ₽"};
    sv.addEventListener("pointermove",mv);sv.addEventListener("pointerdown",mv);
  });
}
fetch("data/history.json?"+Date.now()).then(r=>r.json()).then(x=>{H=x;if(D)render1();else renderCharts()}).catch(()=>{});
function openBank(i){const b=D.banks[i];if(!b)return;const br=b.branches||[];
  const r=(x,l)=>x?`${l} ${f(x.buy)} / ${f(x.sell)}`:"";
  $("mh").innerHTML=`<h2>${esc(b.name)}</h2><div class="mu">Пункты обмена и отделения в Калининграде: ${br.length}. Курс: покупка / продажа.</div>`+
   (br.length?br.map(x=>`<div class="br">${esc(x.address)}<div class="mu">${[r(x.USD,"$"),r(x.EUR,"€")].filter(Boolean).join(" · ")}</div><a class="lk" target="_blank" rel="noopener" href="https://yandex.ru/maps/?text=${encodeURIComponent("Калининград "+b.name+" "+x.address)}">Показать на карте</a></div>`).join(""):'<div class="br mu">Адреса пока не найдены.</div>')+
   `<div class="mu" style="margin-top:8px">Перед визитом уточните курс и наличие валюты в отделении.</div>`;
  $("md").hidden=false}
document.addEventListener("click",e=>{const a=e.target.closest(".lk[data-i]");if(a)openBank(+a.dataset.i);const pb=e.target.closest("button[data-p]");if(pb){P=+pb.dataset.p;renderCharts()}if(e.target.id==="md"||e.target.id==="mc")$("md").hidden=true});
let dp;addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;$("inst").style.display="inline-block"});
$("inst").onclick=()=>{dp&&dp.prompt();$("inst").style.display="none"};
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
