<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Курсы валют · Калининград</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#66707f;--ac:#1a6ef0;--ok:#0a8a4a;--bd:#e2e5ea}
@media(prefers-color-scheme:dark){:root{--bg:#10131a;--card:#1a1f29;--tx:#eef1f5;--mu:#8e98a8;--ac:#5b9bff;--ok:#3ddc84;--bd:#2a3140}}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding:12px;max-width:720px}
h1{font-size:20px}.tabs{display:flex;gap:8px;margin:12px 0}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:26px;font-weight:700}.mu{color:var(--mu);font-size:13px}.ok{color:var(--ok);font-weight:600}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}
.err{color:#c0392b;font-size:13px}
</style></head><body>
<h1>Курсы валют · Калининград</h1>
<div class="mu" id="upd">Загрузка…</div>
<div class="tabs"><button id="t1" class="on">Главная</button><button id="t2">Все банки</button></div>
<div id="v1"></div><div id="v2" hidden></div><div class="err" id="err"></div>
<script>
const f=x=>x==null?"—":x.toFixed(2);
const names={USD:"Доллар США",EUR:"Евро"};
function best(banks,c){
  const a=banks.filter(b=>b[c]);
  if(!a.length)return {};
  return {sell:a.reduce((m,b)=>b[c].buy>m[c].buy?b:m),buy:a.reduce((m,b)=>b[c].sell<m[c].sell?b:m)};
}
const v1=document.getElementById("v1"),v2=document.getElementById("v2"),t1=document.getElementById("t1"),t2=document.getElementById("t2");
fetch("data/rates.json?"+Date.now()).then(r=>r.json()).then(d=>{
  document.getElementById("upd").textContent="Обновлено: "+(d.updated?new Date(d.updated).toLocaleString("ru-RU"):"нет данных");
  document.getElementById("err").textContent=(d.errors||[]).join("; ");
  let h="";
  for(const c of["USD","EUR"]){
    const b=best(d.banks,c),cb=d.cbr[c];
    h+=`<div class="card"><b>${names[c]}</b>
    <div class="row"><span>Курс ЦБ${d.cbr.date?" ("+d.cbr.date+")":""}</span><span class="big">${f(cb)} ₽</span></div>
    <div class="row"><span>Продать выгоднее: <span class="mu">${b.sell?b.sell.name:"—"}</span></span><span class="ok">${f(b.sell&&b.sell[c].buy)} ₽</span></div>
    <div class="row"><span>Купить выгоднее: <span class="mu">${b.buy?b.buy.name:"—"}</span></span><span class="ok">${f(b.buy&&b.buy[c].sell)} ₽</span></div></div>`;
  }
  v1.innerHTML=h+`<div class="mu">«Продать» — банк покупает у вас валюту (макс. курс). «Купить» — банк продаёт вам (мин. курс).</div>`;
  v2.innerHTML=`<div class="card wrap"><table><tr><th>Банк</th><th>$ покупка</th><th>$ продажа</th><th>€ покупка</th><th>€ продажа</th></tr>`+
   d.banks.map(b=>`<tr><td>${b.name}</td><td>${f(b.USD&&b.USD.buy)}</td><td>${f(b.USD&&b.USD.sell)}</td><td>${f(b.EUR&&b.EUR.buy)}</td><td>${f(b.EUR&&b.EUR.sell)}</td></tr>`).join("")+
   `</table><div class="mu">покупка — банк покупает у вас, продажа — банк продаёт вам</div></div>`;
}).catch(e=>document.getElementById("err").textContent="Ошибка загрузки: "+e);
t1.onclick=()=>{v1.hidden=false;v2.hidden=true;t1.className="on";t2.className=""};
t2.onclick=()=>{v1.hidden=true;v2.hidden=false;t2.className="on";t1.className=""};
</script></body></html>
